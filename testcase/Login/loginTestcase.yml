- baseInfo:
    api_name: 登录
    url: /dar/user/login
    method: post
    header:
      Content-Type: application/x-www-form-urlencoded
  testcase:
    - case_name: 正确的用户名/密码
      data:
        user_name: test01
        passwd: admin123
      validation:
        - contains: {'msg':'登录成功','jsonPath':'$.msg'}
      extract:
        token: $.token
#        token: '"token":"(.*?)"'
      extract_list: None
    - case_name: 错误的用户名/密码
      data:
        user_name: test012
        passwd: admin123
      validation:
        - contains: { 'msg': '登录失败,用户名或密码错误','jsonPath':'$.msg'}
    - case_name: 错误的用户名/密码
      data:
        user_name: test01
        passwd: admin1234
      validation:
        - contains: { 'msg': '登录失败,用户名或密码错误','jsonPath':'$.msg'}
