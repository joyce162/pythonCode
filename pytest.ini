[pytest]
# 命令行默认参数，等价每次执行pytest自动带上这些参数
addopts = -vs --reruns 2 --reruns-delay 1

# 测试用例搜索目录 `testpaths`：指定去哪里找测试用例，可以写多个空格隔开
testpaths = ./testcase/

# 用例文件匹配规则：哪些文件识别为测试文件
python_files = test_*.py
# 测试类匹配：以Test开头的类
python_classes = Test*
# 测试函数匹配：test_开头函数
python_functions = test_*

# 忽略哪些目录，不扫描用例
norecursedirs = .venv  venv  __pycache__  report logs

# 日志配置
log_cli = True
log_cli_level = INFO

# 标记注册，自定义mark（@pytest.mark.smoke）
markers =
    smoke: 冒烟用例
    api: 接口测试用例