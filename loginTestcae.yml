- baseInfo:
    api_name: 登录
    url: /dar/user/login
    method: post
    header: None
  testcase:
    - case_name: 正确的用户名/密码
      data:
        user_name: test01
        passwd: admin123
      validation:
        - contains: {'msg':'登录成功'}
      extract:
        token: $.token
    - case_name: 错误的用户名/密码
      data:
        user_name: test012
        passwd: admin123
      validation:
        - contains: { 'msg': '登录成功' }
      extract:
        token: $.token