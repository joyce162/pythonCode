- baseInfo:
    api_name: 登录
    url: /dar/user/login
    method: post
    header:
      Content-Type: application/x-www-form-urlencoded;charset=UTF-8
      token: ${get_extract_data(token)}
  testcase:
    - case_name: 正确的用户名/密码
      data:
        user_name: test01
        passwd: admin123
      validation:
        - contains: {'msg':'登录成功'}
      extract:
        token: $.token
    - case_name: 错误的用户名/密码
      data:
        user_name: test012
        passwd: admin123
      validation:
        - contains: { 'msg': '登录成功' }
      extract:
        token: $.token